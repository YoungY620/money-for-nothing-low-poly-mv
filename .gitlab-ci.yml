pages:
  stage: deploy
  image: $CI_NODE_IMAGE
  script:
    - node --version
    - npm --version
    - docker buildx imagetools inspect "$CI_NODE_IMAGE" || true
    - npm ci
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
